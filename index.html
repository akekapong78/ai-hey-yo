<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PEA AI Zaa 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;700&display=swap');
        body { 
            font-family: 'Prompt', sans-serif; 
            background: #0f172a;
            background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
            color: white;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.5);
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tag-float {
            animation: floating 3s ease-in-out infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-md mx-auto text-center mb-10 animate__animated animate__fadeInDown">
        <div class="relative inline-block">
            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-fuchsia-500 rounded-full blur opacity-75 animate-pulse"></div>
            <div class="relative bg-slate-900 rounded-full p-4">
                <i class="fas fa-terminal text-3xl text-cyan-400"></i>
            </div>
        </div>
        <h1 class="text-4xl font-black mt-6 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-fuchsia-500 uppercase tracking-tighter">
            AI Web Workshop เด้ออ 🫶🏻
        </h1>
        <p class="text-slate-400 text-sm mt-2 font-light tracking-widest">CONNECTING TO FUTURE_DEVELOPERS...</p>
    </div>

    <div class="max-w-md mx-auto space-y-8">
        
        <div class="glass-morphism rounded-[2rem] p-8 neon-border animate__animated animate__fadeIn">
            <form id="workshopForm" class="space-y-6">
                <div class="group">
                    <label class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest ml-1 mb-2 block">Developer Name</label>
                    <input type="text" name="nickname" required placeholder="Enter Nickname"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-5 py-3 focus:outline-none focus:border-cyan-400 transition-all text-white placeholder-slate-500">
                </div>

                <div>
                    <label class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest ml-1 mb-3 block">Current Level</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="experience" value="ไม่เคย" checked class="hidden peer">
                            <div class="peer-checked:bg-cyan-500/20 peer-checked:border-cyan-400 border border-slate-700 rounded-xl p-4 text-center transition-all bg-slate-800/30">
                                <span class="text-2xl block mb-1">🐣</span>
                                <span class="text-[10px] font-bold">ROOKIE</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="experience" value="เคยบ้าง" class="hidden peer">
                            <div class="peer-checked:bg-fuchsia-500/20 peer-checked:border-fuchsia-400 border border-slate-700 rounded-xl p-4 text-center transition-all bg-slate-800/30">
                                <span class="text-2xl block mb-1">⚔️</span>
                                <span class="text-[10px] font-bold">HUNTER</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest ml-1 mb-2 block">Quest Target / Expectations</label>
                    <textarea name="expectation" rows="2" placeholder="อยากทำโปรเจคอะไรในวันนี้?"
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-5 py-3 focus:outline-none focus:border-cyan-400 transition-all text-white"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button type="button" onclick="getLocation()" class="bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-center gap-2 hover:bg-slate-700 transition">
                        <i class="fas fa-location-dot text-cyan-400 text-xs"></i>
                        <span id="locStatus" class="text-[10px] font-bold">GET GPS</span>
                    </button>
                    <div class="relative bg-slate-800 border border-slate-700 rounded-xl p-3 flex items-center justify-center gap-2 hover:bg-slate-700 overflow-hidden transition">
                        <img id="preview" class="absolute inset-0 w-full h-full object-cover hidden opacity-50">
                        <i class="fas fa-coffee text-fuchsia-400 text-xs"></i>
                        <span id="photoStatus" class="text-[10px] font-bold">DRINK PIC</span>
                        <input type="file" id="photoInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" required>
                    </div>
                </div>
                <input type="hidden" name="latitude" id="latInput">
                <input type="hidden" name="longitude" id="lngInput">

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black py-4 rounded-xl shadow-[0_0_20px_rgba(34,211,238,0.3)] transform active:scale-95 transition-all uppercase tracking-widest">
                    Initialize Data <i class="fas fa-paper-plane ml-2"></i>
                </button>
            </form>
        </div>

        <div class="glass-morphism rounded-[2rem] p-6 neon-border relative overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <h2 class="text-xs font-bold uppercase tracking-widest text-slate-300">Live Feedback</h2>
                </div>
                <button onclick="loadExpectations()" id="refreshBtn" class="text-slate-500 hover:text-cyan-400 transition">
                    <i class="fas fa-sync-alt text-xs"></i>
                </button>
            </div>
            
            <div id="tagCloud" class="flex flex-wrap gap-2">
                <p class="text-[10px] text-slate-500 italic">No incoming data...</p>
            </div>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 bg-slate-950/90 hidden flex-col items-center justify-center z-50">
        <div class="w-20 h-20 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"></div>
        <p class="mt-4 text-cyan-400 font-mono text-sm tracking-[0.3em] animate-pulse">UPLOADING_DATA...</p>
    </div>

    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzKHHaRCspqn-nLTBTXSX6U2P-z_20bJIyes6TDiOoRAw2KJXNhlCtdjBgkdHltaO0u/exec';
        const successSnd = document.getElementById('successSound');
        const clickSnd = document.getElementById('clickSound');

        function getLocation() {
            clickSnd.play();
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('locStatus').innerText = "LOCATION FIXED";
                document.getElementById('latInput').value = pos.coords.latitude;
                document.getElementById('lngInput').value = pos.coords.longitude;
                confetti({ particleCount: 50, spread: 30, origin: { y: 0.8 }, colors: ['#22d3ee'] });
            });
        }

        document.getElementById('photoInput').onchange = e => {
            const file = e.target.files[0];
            if(file) {
                document.getElementById('preview').src = URL.createObjectURL(file);
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('photoStatus').innerText = "SNAP STORED";
            }
        };

        async function loadExpectations() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('animate-spin');
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                const container = document.getElementById('tagCloud');
                container.innerHTML = '';

                data.reverse().forEach((text, i) => {
                    const span = document.createElement('span');
                    // สลับสี Neon สวยๆ
                    const colors = [
                        'border-cyan-500/50 bg-cyan-500/10 text-cyan-400',
                        'border-fuchsia-500/50 bg-fuchsia-500/10 text-fuchsia-400',
                        'border-yellow-500/50 bg-yellow-500/10 text-yellow-400'
                    ];
                    span.className = `border px-3 py-1.5 rounded-lg text-[11px] font-bold tag-float ${colors[i % 3]}`;
                    span.innerText = text;
                    container.appendChild(span);
                });
            } catch (e) { console.log(e) }
            finally { btn.classList.remove('animate-spin'); }
        }

        document.getElementById('workshopForm').onsubmit = e => {
            e.preventDefault();
            document.getElementById('loading').style.display = 'flex';
            
            const reader = new FileReader();
            reader.onload = function() {
                const base64Data = reader.result.split(',')[1];
                const params = new URLSearchParams(new FormData(e.target));
                params.append('photo', base64Data);
                params.append('photoContent', reader.result.split(',')[0]);

                fetch(scriptURL, { method: 'POST', body: params })
                .then(() => {
                    document.getElementById('loading').style.display = 'none';
                    successSnd.play(); // เล่นเสียง
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); // จุดพลุ
                    alert('QUEST COMPLETE! ข้อมูลของคุณถูกส่งแล้ว');
                    e.target.reset();
                    document.getElementById('preview').classList.add('hidden');
                    loadExpectations();
                });
            };
            reader.readAsDataURL(document.getElementById('photoInput').files[0]);
        };

        window.onload = loadExpectations;
    </script>
</body>
</html>
